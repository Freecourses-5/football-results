<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كورة لايف - نتائج مباريات كرة القدم</title><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="topbar"><a class="brand" href="./">⚽ كورة لايف</a><nav><a href="./">الرئيسية</a><a href="#matches">المباريات</a><a href="#leagues">البطولات</a></nav><button id="themeBtn" class="theme-btn">☾</button></header>
<main class="container">
<section class="hero"><p class="eyebrow">FOOTBALL SCORES</p><h1>نتائج مباريات كرة القدم</h1><p>تابع مباريات اليوم والنتائج المباشرة من مصدر بيانات رياضي موثوق.</p></section>
<section class="controls"><div><label>التاريخ</label><div class="date-row"><button id="prevDay">‹</button><input id="date" type="date"><button id="nextDay">›</button><button id="todayBtn">اليوم</button></div></div><div><label>الحالة</label><select id="status"><option value="all">الكل</option><option value="live">🔴 مباشر</option><option value="scheduled">لم تبدأ</option><option value="finished">انتهت</option></select></div></section>
<section id="matches" class="matches-section"><div class="section-title"><h2>مباريات اليوم</h2><button id="refreshBtn" class="refresh">تحديث</button></div><div id="state" class="state">جاري تحميل المباريات...</div><div id="matchesList" class="matches-list"></div></section>
</main><footer>كورة لايف — منصة نتائج مباريات كرة القدم</footer><script src="./app.js"></script>
</body></html>
